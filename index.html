        /* ポータル(総合ニュース一覧)パネル: アクセス直後にヤフーニュース的な

        #portal-regions::-webkit-scrollbar,

            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(0,0,0,0.05);
            color: #4b5563;
            white-space: nowrap;
            cursor: pointer;
            border: none;
        }
        .dark .portal-tab { background: rgba(255,255,255,0.08); color: #d1d5db; }
        .portal-tab.portal-tab-active { background: #111827; color: white; }
        .dark .portal-tab.portal-tab-active { background: #f3f4f6; color: #111827; }

        .portal-featured-card, .portal-list-item {
            cursor: pointer;
            transition: box-shadow 0.15s, transform 0.15s;
        }
        .portal-featured-card:hover, .portal-list-item:hover {
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            transform: translateY(-1px);
        }


        /* ポータル内のミニ地図プレビュー: 地図機能の存在に気づかれないまま
           使われなくなるのを防ぐため、総合パネルの中に常に小さい地図を表示しておき、

        #portal-map-preview-card {
            position: relative;
            height: 140px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 16px;

                        border-radius 0.45s cubic-bezier(0.4,0,0.2,1);
        }
        #portal-map-preview-card.portal-map-expanding {
            position: fixed;
            z-index: 1450;
        }
        #portal-map-preview { width: 100%; height: 100%; }
        #portal-map-preview-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(17,24,39,0.35);
            color: white;
            font-weight: 800;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
        }

    </style>

        // --- セキュリティ用ヘルパー ---
        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function safeHttpUrl(url, fallback) {
            try {
                const u = new URL(url, window.location.href);
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch (e) { /* invalid URL */ }
            return fallback;
        }

        // --- 日時表示ヘルパー ---
        const WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];

        function formatTodayDate() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            return `今日: ${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日(${WEEKDAY_JA[now.getDay()]}) ${hh}:${mm}:${ss}`;
        }

        function formatRelativeTime(iso) {
            if (!iso) return null;
            const d = new Date(iso);
            if (isNaN(d.getTime())) return null;
            const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
            if (diffMin < 1) return 'たった今';
            if (diffMin < 60) return `${diffMin}分前`;
            const diffHour = Math.round(diffMin / 60);
            if (diffHour < 24) return `${diffHour}時間前`;
            const diffDay = Math.round(diffHour / 24);
            return `${diffDay}日前`;
        }

        // --- ダークモード ---
        function applyThemeIcon() {

            } catch (e) { /* localStorage無効環境は無視 */ }
            applyThemeIcon();
        };
        applyThemeIcon();

        // --- ヘッダーの折りたたみ(スマホで地図が見づらくならないよう、上へ隠せる) ---

        };
        (function restoreHeaderState() {
            try {
                if (localStorage.getItem('sekanews_header_collapsed') === '1') {
                    document.getElementById('header-card').classList.add('collapsed');
                    const btn = document.getElementById('header-toggle');

        // 応援リンクの表示切替
        (function setupSupportLink() {

            }
        })();

        // 地図の初期化(データ取得前に先に表示できる)
        // preferCanvas: ピンを1個ずつDOM要素にせず、1枚のcanvasに描く(千件超でも軽い)
        const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([20.0, 60.0], 3);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {

            maxZoom: 19
        }).addTo(map);

        const sidebarPanel = document.getElementById('sidebar-panel');
        const sidebarContent = document.getElementById('sidebar-content');
        const areaNewsBtn = document.getElementById('area-news-btn');
        const areaNewsCount = document.getElementById('area-news-count');
        const legendContainer = document.getElementById('legend-container');
        const statusBanner = document.getElementById('status-banner');
        const lastUpdatedEl = document.getElementById('last-updated');
        const todayDateEl = document.getElementById('today-date');
        const loadingOverlay = document.getElementById('loading-overlay');
        const searchInput = document.getElementById('search-input');

        let clusterGroup = null;
        let lastFocusedElement = null;

        // --- ジャンルフィルタ・キーワード検索 ---
        let activeCategories = null; // null = 初回未初期化(buildLegendで全ジャンルONにする)
        let allCategoriesSet = new Set(); // データ中に実際に存在する全ジャンル(ソロ解除時に使う)
        let searchQuery = '';

        function matchesFilter(news) {
            if (activeCategories && !activeCategories.has(news.category)) return false;
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                const haystack = `${news.title || ''} ${news.originalTitle || ''} ${news.aiSummary || ''} ${news.location.name || ''}`.toLowerCase();
                if (!haystack.includes(q)) return false;
            }
            return true;
        }

        const portalSearchInput = document.getElementById('portal-search-input');
        function handleSearchInput(value) {
            searchQuery = value.trim();
            portalListLimit = 60;
            if (searchInput && searchInput.value !== value) searchInput.value = value;
            if (portalSearchInput && portalSearchInput.value !== value) portalSearchInput.value = value;
            renderMap();
            renderPortal();
        }
        searchInput.addEventListener('input', () => handleSearchInput(searchInput.value));
        if (portalSearchInput) portalSearchInput.addEventListener('input', () => handleSearchInput(portalSearchInput.value));

        // ジャンルクリック = そのジャンルだけを表示(ソロ表示)。
        // 既にそのジャンル1つだけがソロ表示中の状態でもう一度押すと、全ジャンル表示に戻す。
        window.toggleCategory = function (category) {
            const isSoloingThis = activeCategories.size === 1 && activeCategories.has(category);
            if (isSoloingThis) {
                activeCategories = new Set(allCategoriesSet);
            } else {
                activeCategories = new Set([category]);
            }
            buildLegend();
            renderMap();
        };

        // --- 急上昇エリア検知(大島てる方式): 直近24時間で同じ地名にピンが
        //     集中しているエリアを検知して、地図上でハイライトする ---
        function computeSpikyPlaces() {
            const now = Date.now();
            const counts = new Map();
            newsData.forEach(n => {
                if (n.isSponsored) return;
                const tsStr = n.firstSeenAt || n.publishedAt;
                if (tsStr) {
                    const d = new Date(tsStr).getTime();
                    if (!isNaN(d) && (now - d) > SPIKE_WINDOW_MS) return;
                }
                const key = n.location && n.location.name;
                if (!key) return;
                counts.set(key, (counts.get(key) || 0) + 1);
            });
            const spiky = new Set();
            counts.forEach((c, key) => { if (c >= SPIKE_THRESHOLD) spiky.add(key); });
            return spiky;
        }

        function showStatus(message, isStale) {
            statusBanner.textContent = message;
            statusBanner.style.display = 'block';
            statusBanner.classList.toggle('stale', !!isStale);
        }

        function showLastUpdated(generatedAtIso, nextUpdateAtIso) {
            if (!generatedAtIso) return;
            const generatedAt = new Date(generatedAtIso);
            if (isNaN(generatedAt.getTime())) return;

            const diffMinutes = Math.round((Date.now() - generatedAt.getTime()) / 60000);
            let label;
            if (diffMinutes < 60) {
                label = `最終更新: ${diffMinutes}分前`;
            } else {
                label = `最終更新: ${Math.round(diffMinutes / 60)}時間前`;
            }


            lastUpdatedEl.innerHTML = `<div>${escapeHtml(label)}</div>`;
            lastUpdatedEl.style.display = 'block';

            // 12時間以上更新が無ければ、パイプラインが止まっている可能性を警告する
            // (GitHub Actionsの定期実行は混雑で実際には約6時間おきになることが多く、
            //  3時間だと常時警告が出てしまうため緩めている)
            const STALE_THRESHOLD_MINUTES = 720;
            if (diffMinutes > STALE_THRESHOLD_MINUTES) {
                showStatus('⚠ 更新が長時間止まっている可能性があります(自動更新パイプラインを確認してください)', true);
            }
        }

        // 新しいピンが増えていたら軽いトースト演出を出す
        function showNewPinsToast(count) {
            if (count <= 0) return;
            const toast = document.createElement('div');
            toast.className = 'pin-toast';
            toast.textContent = `+${count}件のニュースが新しく追加されました`;
            document.body.appendChild(toast);
            requestAnimationFrame(() => { toast.style.opacity = '1'; });
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 3500);
        }

        // 凡例をデータ中の実際のジャンルから動的に生成。クリックで表示/非表示を切替。
        function buildLegend() {
            const seen = new Map();
            newsData.forEach(n => {
                if (!seen.has(n.category)) seen.set(n.category, n.color);
            });
            allCategoriesSet = new Set(seen.keys());
            if (!activeCategories) {
                activeCategories = new Set(allCategoriesSet);
            }
            legendContainer.innerHTML = Array.from(seen.entries()).map(([category, color]) => {
                const isActive = activeCategories.has(category);
                const catAttr = escapeHtml(category).replace(/"/g, '&quot;');
                return `
                    <button type="button" onclick="toggleCategory(&quot;${catAttr}&quot;)" aria-pressed="${isActive}"
                            class="flex items-center gap-1.5 px-1.5 py-0.5 rounded-md transition-opacity text-gray-700 dark:text-gray-200 ${isActive ? '' : 'opacity-30 grayscale'}">
                        <span class="w-3 h-3 rounded-full" style="background-color:${escapeHtml(color)}"></span>${escapeHtml(category)}
                    </button>
                `;
            }).join('');
        }

        // --- 「後で読む」ブックマーク(localStorageに保存。実際に機能するようにした) ---
        function getBookmarks() {
            try { return new Set(JSON.parse(localStorage.getItem('sekanews_bookmarks') || '[]')); }
            catch (e) { return new Set(); }
        }
        function saveBookmarks(set) {
            try { localStorage.setItem('sekanews_bookmarks', JSON.stringify(Array.from(set))); }
            catch (e) { /* localStorage無効環境は無視 */ }
        }
        function isBookmarked(id) { return getBookmarks().has(id); }
        window.toggleBookmark = function (id, btnEl) {
            const bookmarks = getBookmarks();
            const nowSaved = !bookmarks.has(id);
            if (nowSaved) bookmarks.add(id); else bookmarks.delete(id);
            saveBookmarks(bookmarks);
            if (btnEl) {
                btnEl.innerHTML = nowSaved
                    ? '<i class="ph-fill ph-bookmark-simple text-lg" aria-hidden="true"></i> 保存済み'
                    : '<i class="ph ph-bookmark-simple text-lg" aria-hidden="true"></i> 後で読む';
                btnEl.classList.toggle('bg-amber-100', nowSaved);
                btnEl.classList.toggle('dark:bg-amber-900/40', nowSaved);
                btnEl.classList.toggle('text-amber-700', nowSaved);
                btnEl.classList.toggle('dark:text-amber-300', nowSaved);
                btnEl.classList.toggle('bg-gray-100', !nowSaved);
                btnEl.classList.toggle('dark:bg-gray-800', !nowSaved);
                btnEl.classList.toggle('text-gray-700', !nowSaved);
                btnEl.classList.toggle('dark:text-gray-200', !nowSaved);
            }
        };

        function openSidebar(news, side = 'left', fromList = false) {
            lastFocusedElement = document.activeElement;
            // 一覧から開いたときだけ「一覧にもどる」を出す(一覧→記事→一覧、と行き来できる)
            const backBtnHtml = (fromList && lastListState)
                ? `<button type="button" onclick="reopenLastList()" class="mb-4 inline-flex items-center gap-1.5 text-xs font-bold text-gray-600 dark:text-gray-300 hover:underline"><i class="ph ph-arrow-left" aria-hidden="true"></i> 一覧にもどる</button>`
                : '';

            sidebarPanel.classList.remove('left-side', 'right-side');
            sidebarPanel.classList.add(`${side}-side`);

            const safeImg = news.imageUrl ? safeHttpUrl(news.imageUrl, '') : '';
            const safeArticleUrl = safeHttpUrl(news.url, '#');
            // 2026-07-09: AI自動生成である旨と誤り報告の導線を、以前は見出しのみ要約の
            // 記事だけに限定して表示していたが、全記事に常時表示するよう変更した
            // (透明性向上のため)。報告先はサイト専用の問い合わせアドレス。
            const reportMailto = `mailto:sekai.news.info@gmail.com` +
                `?subject=${encodeURIComponent('せかにゅ 誤り報告: ' + (news.title || ''))}` +
                `&body=${encodeURIComponent('記事ID: ' + news.id + '\n元記事URL: ' + (news.url || '') + '\n\n【誤りの内容】\n')}`;
            const headlineOnlyNote = news.aiSummary
                ? '見出しから推測したAI要約です(一般的な背景情報の補足を含む場合があります)。タイトルもAIによる日本語訳です。詳細は元記事でご確認ください。'
                : 'タイトルはAIによる日本語訳です。誤訳や誤りが含まれる場合があります。詳細は元記事でご確認ください。';
            const disclaimer = `<p class="text-[11px] text-purple-400 dark:text-purple-300/80 mt-2">※ ${headlineOnlyNote} <a href="${reportMailto}" class="underline">誤りを報告</a></p>`;

            const relTime = formatRelativeTime(news.publishedAt);
            const timeHtml = relTime
                ? `<span class="text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1"><i class="ph ph-clock" aria-hidden="true"></i> ${escapeHtml(relTime)}</span>`
                : '';

            const showOriginal = news.originalTitle && news.originalTitle !== news.title;
            const originalHtml = showOriginal
                ? `<p class="text-xs text-gray-400 dark:text-gray-500 mt-1.5">原文タイトル: ${escapeHtml(news.originalTitle)}</p>`
                : '';

            const sourceHtml = news.sourceName
                ? `<p class="text-xs text-gray-400 dark:text-gray-500 mt-1">情報源: ${escapeHtml(news.sourceName)}</p>`
                : '';

            const isSponsored = !!news.isSponsored;
            const isSpiky = !isSponsored && computeSpikyPlaces().has(news.location.name);
            const badgesHtml = `
                ${isSponsored ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">PR</span>` : ''}
                ${isSpiky ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300">🔥 急上昇</span>` : ''}
            `;

            const shareText = encodeURIComponent(news.title || '');
            const shareUrlEnc = encodeURIComponent(safeArticleUrl);
            const xShareUrl = `https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrlEnc}`;
            const lineShareUrl = `https://social-plugins.line.me/lineit/share?url=${shareUrlEnc}&text=${shareText}`;
            const copyArg = safeArticleUrl.replace(/'/g, "\\'");
            // 2026-07-09: SNSでシェアしても元記事(他社サイト)に飛ぶだけでせかにゅ自体には
            // 誰も戻ってこない問題があったため、せかにゅのこの記事に直接ジャンプできる
            // 固有リンク(#news=id)を追加した。共有・SEO対策として、これは元記事とは別に
            // 用意し、両方を選べるようにする。
            const sekanewsShareUrl = `${location.origin}${location.pathname}#news=${encodeURIComponent(news.id)}`;
            const sekanewsCopyArg = sekanewsShareUrl.replace(/'/g, "\\'");
            const imageBlockHtml = safeImg
                ? `<div class="rounded-xl overflow-hidden shadow-md h-48 bg-gray-200">
                    <img src="${escapeHtml(safeImg)}" alt="${escapeHtml(news.title)}" class="w-full h-full object-cover"
                         onerror="this.closest('.rounded-xl').style.display='none';">
                </div>`
                : '';

            sidebarContent.innerHTML = `
                <div>
                    ${backBtnHtml}
                    <div class="flex items-center gap-2 mb-3 flex-wrap">
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold text-white" style="background-color: ${escapeHtml(news.color)}">
                            ${moodEmoji(news.category)}${escapeHtml(news.category)}
                        </span>
                        <span class="text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1">
                            <i class="ph-fill ph-map-pin" aria-hidden="true"></i> ${escapeHtml(news.location.name)}
                        </span>
                        ${timeHtml}
                        ${badgesHtml}
                    </div>
                    <h2 class="text-2xl font-extrabold text-gray-900 dark:text-gray-100 leading-tight">${escapeHtml(news.title)}</h2>
                    ${originalHtml}
                    ${sourceHtml}
                </div>

                ${imageBlockHtml}

                <div class="bg-purple-50 dark:bg-purple-950/40 p-4 rounded-xl border border-purple-100 dark:border-purple-900">
                    <h3 class="text-sm font-bold text-purple-700 dark:text-purple-300 flex items-center gap-1.5 mb-2">
                        <i class="ph-fill ph-sparkle" aria-hidden="true"></i> ${news.aiSummary ? 'AI要約' : 'AI翻訳タイトル'}
                    </h3>
                    <p class="text-sm text-gray-700 dark:text-gray-200 leading-relaxed font-medium">
                        ${news.aiSummary ? escapeHtml(news.aiSummary) : '詳しい内容は下の「元記事を読む」から情報源のサイトでご確認ください。'}
                    </p>
                    ${disclaimer}
                </div>

                <div class="flex flex-col gap-3 pt-4 mt-auto">
                    <a href="${escapeHtml(safeArticleUrl)}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-2 bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 px-4 rounded-xl transition-colors">
                        <i class="ph ph-arrow-square-out text-lg" aria-hidden="true"></i> 元記事を読む
                    </a>
                    <div class="grid grid-cols-3 gap-2">
                        <a href="${xShareUrl}" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center justify-center gap-1 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold py-2 rounded-xl transition-colors text-[11px]">
                            <i class="ph ph-x-logo text-base" aria-hidden="true"></i> X
                        </a>
                        <a href="${lineShareUrl}" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center justify-center gap-1 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold py-2 rounded-xl transition-colors text-[11px]">
                            <i class="ph ph-chat-circle-dots text-base" aria-hidden="true"></i> LINE
                        </a>
                        <button onclick="copyNewsLink('${copyArg}', this)" class="flex flex-col items-center justify-center gap-1 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold py-2 rounded-xl transition-colors text-[11px]">
                            <i class="ph ph-link text-base" aria-hidden="true"></i> コピー
                        </button>
                    </div>
                    <button onclick="toggleBookmark(${news.id}, this)" class="flex items-center justify-center gap-2 ${isBookmarked(news.id) ? 'bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200'} hover:opacity-90 font-bold py-2.5 px-4 rounded-xl transition-colors text-sm">
                        <i class="ph${isBookmarked(news.id) ? '-fill' : ''} ph-bookmark-simple text-lg" aria-hidden="true"></i> ${isBookmarked(news.id) ? '保存済み' : '後で読む'}
                    </button>
                    <button onclick="copyNewsLink('${sekanewsCopyArg}', this)" class="flex items-center justify-center gap-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold py-2.5 px-4 rounded-xl transition-colors text-sm">
                        <i class="ph ph-share-network text-lg" aria-hidden="true"></i> せかにゅでこの記事をシェア
                    </button>
                </div>
            `;

            setTimeout(() => {
                sidebarPanel.classList.add('sidebar-visible');
                const closeBtn = sidebarPanel.querySelector('.close-button');
                if (closeBtn) closeBtn.focus();
            }, 10);
        }

        window.copyNewsLink = function (url, btnEl) {
            const finish = (ok) => {
                const original = btnEl.innerHTML;
                btnEl.innerHTML = ok
                    ? '<i class="ph ph-check text-base" aria-hidden="true"></i> コピー済'
                    : '<i class="ph ph-x text-base" aria-hidden="true"></i> 失敗';
                setTimeout(() => { btnEl.innerHTML = original; }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => finish(true)).catch(() => finish(false));
            } else {
                finish(false);
            }
        };

        // ------------------------------------------------------------------
        // ニュース一覧パネル(サイドバー)。「表示中エリア」ボタンと、地図上のクラスタ
        // (丸い数字)のクリックの両方がここを使う。クラスタを押すと拡大せず、そこにある
        // ニュースの一覧がすぐ開き、カードを押せば記事詳細へ進める(2クリックで読める)。
        // ------------------------------------------------------------------
        const LIST_PANEL_MAX_ITEMS = 80; // 一覧に出す最大件数(DOMを増やしすぎない)
        let lastListState = null;        // 記事詳細から「一覧にもどる」ための記憶
        let lastClusterBounds = null;    // 「この範囲を拡大」用

        // おすすめ度(score)の高い順 → 新しい順
        function newsRank(a, b) {
            return ((b.score || 3) - (a.score || 3)) || (portalNewsScore(b) - portalNewsScore(a));
        }

        function openNewsListPanel(title, items, side, extraHtml) {
            lastFocusedElement = document.activeElement;
            lastListState = { title, items, side, extraHtml: extraHtml || '' };

            sidebarPanel.classList.remove('left-side', 'right-side');
            sidebarPanel.classList.add(`${side}-side`);

            if (items.length === 0) {
                sidebarContent.innerHTML = `<div class="text-center text-gray-500 dark:text-gray-400 mt-10">このエリアにはニュースがありません</div>`;
            } else {
                const spikyPlaces = computeSpikyPlaces();
                const sorted = items.slice().sort(newsRank);
                const shown = sorted.slice(0, LIST_PANEL_MAX_ITEMS);
                let listHtml = `<h2 class="text-xl font-extrabold mb-4 flex items-center gap-2 text-gray-900 dark:text-gray-100"><i class="ph ph-map-pin" aria-hidden="true"></i> ${escapeHtml(title)}(${items.length}件)</h2>${extraHtml || ''}`;
                if (items.length > shown.length) {
                    listHtml += `<p class="text-xs text-gray-500 dark:text-gray-400 mb-3">おすすめ順に${shown.length}件を表示しています。地図を拡大すると絞り込めます。</p>`;
                }
                listHtml += `<div class="space-y-4">`;
                shown.forEach(news => {
                    const relTime = formatRelativeTime(news.publishedAt);
                    const timeBadge = relTime ? `<span class="text-[11px] text-gray-400 dark:text-gray-500">・${escapeHtml(relTime)}</span>` : '';
                    const isSponsored = !!news.isSponsored;
                    const isSpiky = !isSponsored && spikyPlaces.has(news.location.name);
                    const tag = isSponsored
                        ? `<span class="text-[9px] font-bold text-amber-600 dark:text-amber-400">PR</span>`
                        : (isSpiky ? `<span class="text-[9px] font-bold text-red-600 dark:text-red-400">🔥急上昇</span>` : '');
                    listHtml += `
                        <div class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl p-4 shadow-sm hover:shadow-md cursor-pointer transition-shadow" role="button" tabindex="0"
                             onclick="openSidebarFromList(${news.id})"
                             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSidebarFromList(${news.id});}">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold text-white" style="background-color: ${escapeHtml(news.color)}">${moodEmoji(news.category)}${escapeHtml(news.category)}</span>
                                <span class="text-xs font-bold text-gray-500 dark:text-gray-400">${escapeHtml(news.location.name)}</span>
                                ${timeBadge}
                                ${tag}
                            </div>
                            <h3 class="font-bold text-sm leading-tight text-gray-900 dark:text-gray-100">${escapeHtml(news.title)}</h3>
                        </div>
                    `;
                });
                listHtml += `</div>`;
                sidebarContent.innerHTML = listHtml;
            }

            setTimeout(() => sidebarPanel.classList.add('sidebar-visible'), 10);
        }

        function openAreaNewsList() {
            const bounds = map.getBounds();
            const visibleNews = newsData.filter(news => matchesFilter(news) && bounds.contains([news.location.lat, news.location.lng]));
            openNewsListPanel('表示中エリアのニュース', visibleNews, 'right');
        }

        // 地図上のクラスタ(丸い数字)をクリックしたとき: そこに含まれるニュースの一覧を開く。
        // クラスタが画面の左半分にあれば一覧は右側に出して、クラスタ自体は隠さない。
        function openClusterList(cluster, latlng) {
            const ids = new Set(cluster.getAllChildMarkers().map(m => m.options.newsId));
            const items = newsData.filter(n => ids.has(n.id));
            const point = map.latLngToContainerPoint(latlng);
            const side = (point.x < window.innerWidth / 2) ? 'right' : 'left';
            lastClusterBounds = cluster.getBounds();
            const zoomBtn = `<button type="button" onclick="zoomToLastCluster()" class="mb-4 inline-flex items-center gap-1.5 text-xs font-bold bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-full transition-colors"><i class="ph ph-magnifying-glass-plus" aria-hidden="true"></i> この範囲を拡大</button>`;
            openNewsListPanel('このエリアのニュース', items, side, zoomBtn);
        }

        window.zoomToLastCluster = function () {
            if (!lastClusterBounds) return;
            closeSidebar();
            map.fitBounds(lastClusterBounds.pad(0.2), { maxZoom: 12 });
        };

        // 一覧のカードから記事詳細へ(詳細には「一覧にもどる」ボタンが付く)
        window.openSidebarFromList = function (id) {
            const news = newsData.find(n => n.id === id);
            if (news) openSidebar(news, lastListState ? lastListState.side : 'right', !!lastListState);
        };

        window.reopenLastList = function () {
            if (!lastListState) return;
            const s = lastListState;
            openNewsListPanel(s.title, s.items, s.side, s.extraHtml);
        };

        // おすすめの帯や総合画面から: 記事の場所へ飛んで詳細を開く
        window.goToNews = function (id) {
            const news = newsData.find(n => n.id === id);
            if (!news || !news.location) return;
            closePortal();
            lastListState = null;
            map.flyTo([news.location.lat, news.location.lng], Math.max(map.getZoom(), 7), { duration: 0.8 });
            openSidebar(news, 'right');
        };

        function closeSidebar() {
            sidebarPanel.classList.remove('sidebar-visible');
            if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') {
                lastFocusedElement.focus();
            }
        }

        map.on('click', closeSidebar);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSidebar();
        });

        function updateVisibleNewsCount() {
            const bounds = map.getBounds();
            const visibleNews = newsData.filter(news => matchesFilter(news) && bounds.contains([news.location.lat, news.location.lng]));

            if (visibleNews.length > 0) {
                areaNewsBtn.style.display = 'flex';
                areaNewsCount.textContent = `このエリアのニュース (${visibleNews.length}件)`;
            } else {
                areaNewsBtn.style.display = 'none';
            }
        }

        map.on('moveend', updateVisibleNewsCount);


        // 気分(ジャンル)ごとの絵文字
        const MOOD_EMOJI = { '爆笑': '😂', 'ほっこり': '🥰', '動物': '🐾', 'コミカル': '🤪', '驚き': '😲' };
        function moodEmoji(category) {
            return MOOD_EMOJI[category] ? MOOD_EMOJI[category] + ' ' : '';
        }

        // newsData を元に地図上へピンを立てる(クラスタリング対応。データ読み込み完了後に呼ばれる)
        // 2026-10-24: 軽量化のため、ピンを「1個ずつHTML要素」から「canvasに描く丸」(circleMarker)
        // に変更した(preferCanvas)。以前、重なったピンをずらして散らしたら千件超のDOM要素で
        // 重くなったが、canvas描画なら数千件でも軽い。また、クラスタ(丸い数字)をクリックしたら
        // 拡大ではなく一覧パネルを開く(openClusterList)。同じ座標に何件重なっていても
        // 一覧から全部読めるので、従来のspiderfy(弾けて広がる操作)は不要になった。
        function renderMap() {
            if (clusterGroup) {
                map.removeLayer(clusterGroup);
            }
            clusterGroup = L.markerClusterGroup({
                maxClusterRadius: 55,
                showCoverageOnHover: false,
                zoomToBoundsOnClick: false, // クリックは「拡大」ではなく「一覧を開く」に使う
                chunkedLoading: true,
                animate: false
            });
            clusterGroup.on('clusterclick', (e) => openClusterList(e.layer, e.latlng));

            const spikyPlaces = computeSpikyPlaces();
            const markers = [];

            newsData.forEach(news => {
                if (!matchesFilter(news)) return;

                const isSponsored = !!news.isSponsored;
                const isSpiky = !isSponsored && spikyPlaces.has(news.location.name);

                const marker = L.circleMarker([news.location.lat, news.location.lng], {
                    radius: isSponsored ? 11 : 9,
                    fillColor: news.color,
                    fillOpacity: 0.95,
                    color: isSpiky ? '#dc2626' : (isSponsored ? '#eab308' : '#ffffff'),
                    weight: (isSpiky || isSponsored) ? 3 : 2,
                    bubblingMouseEvents: false, // ピンのクリックで地図のclickが走ってサイドバーが閉じるのを防ぐ
                    newsId: news.id
                });

                marker.on('click', function (e) {
                    const containerPoint = map.latLngToContainerPoint(e.latlng);
                    const side = (containerPoint.x < window.innerWidth / 2) ? 'left' : 'right';
                    lastListState = null;
                    openSidebar(news, side);
                });

                marker.bindTooltip(`
                    <div class="flex items-center gap-1.5 mb-1">
                        <span class="w-2 h-2 rounded-full" style="background-color: ${escapeHtml(news.color)}"></span>
                        <span class="text-[10px] text-gray-500">${moodEmoji(news.category)}${escapeHtml(news.category)}</span>
                        ${isSponsored ? '<span class="text-[9px] font-bold text-amber-600">PR</span>' : ''}
                        ${isSpiky ? '<span class="text-[9px] font-bold text-red-600">🔥急上昇</span>' : ''}
                    </div>
                    <div class="text-xs">${escapeHtml(news.title)}</div>
                 `, {
                    direction: 'top',
                    offset: [0, -10],
                    className: 'rich-tooltip'
                });

                markers.push(marker);
            });

            clusterGroup.addLayers(markers);
            map.addLayer(clusterGroup);

            buildLegend();
            updateVisibleNewsCount();
        }

        // ------------------------------------------------------------------
        // おすすめニュースの帯(地図の最上部に横へ流れ続ける)
        // おすすめ度(score)が高く、新しめの記事を最大24件、毎回少し並びを変えて流す。
        // 項目をクリックすると、その場所へ飛んで記事詳細を開く。マウスを載せると止まる。
        // ------------------------------------------------------------------
        function buildTicker() {
            const tickerEl = document.getElementById('ticker');
            const track = document.getElementById('ticker-track');
            if (!tickerEl || !track) return;

            const now = Date.now();
            const pool = newsData.filter(n => !n.isSponsored && n.location);
            const fresh = pool.filter(n => {
                const t = portalNewsScore(n);
                return t === -Infinity || (now - t) < 72 * 3600 * 1000;
            });
            const base = fresh.length >= 8 ? fresh : pool;
            const picked = base
                .map(n => ({ n, k: (n.score || 3) + Math.random() * 1.5 }))
                .sort((a, b) => b.k - a.k)
                .slice(0, 24)
                .map(x => x.n);

            if (picked.length === 0) {
                tickerEl.classList.remove('ticker-on');
                return;
            }

            const itemsHtml = picked.map(n => `
                <button type="button" class="ticker-item" onclick="goToNews(${n.id})">
                    <span class="ticker-dot" style="background:${escapeHtml(n.color)}"></span>
                    <span>${moodEmoji(n.category)}${escapeHtml(n.title)}</span>
                    <span class="ticker-place">${escapeHtml(n.location.name)}</span>
                </button>`).join('');
            // 同じ内容を2回並べて、-50%まで動かすと継ぎ目なく繰り返す
            track.innerHTML = itemsHtml + itemsHtml;
            track.style.setProperty('--ticker-duration', (picked.length * 8) + 's');
            tickerEl.classList.add('ticker-on');
        }

        // ------------------------------------------------------------------
        // ポータル(総合ニュース一覧)パネル
        // アクセス直後に、地図を見なくても完結する「ニュースサイトのトップページ」的な
        // 一覧をまず見せるための機能。カテゴリタブ・注目ニュース・全件リストで構成する。
        // ------------------------------------------------------------------
        let portalActiveCategory = null; // null = 総合(全カテゴリ)
        let portalListLimit = 60; // 総合パネルのリストは60件ずつ表示し「もっと見る」で追加
        let portalShowBookmarkedOnly = false;
        window.togglePortalBookmarkedOnly = function () {
            portalShowBookmarkedOnly = !portalShowBookmarkedOnly;
            portalListLimit = 60;
            renderPortal();
        };

        window.setPortalCategory = function (category) {
            portalActiveCategory = (portalActiveCategory === category) ? null : category;
            portalListLimit = 60;
            renderPortal();
        };

        window.openPortal = function () {
            document.getElementById('portal-panel').classList.remove('portal-hidden');
            ensurePortalPreviewMap();
        };

        window.closePortal = function () {
            document.getElementById('portal-panel').classList.add('portal-hidden');
        };

        // ミニ地図プレビュー(常に見える小さい地図。地図機能自体が見過ごされないための導線)
        let portalPreviewMap = null;
        function ensurePortalPreviewMap() {
            if (portalPreviewMap) { setTimeout(() => portalPreviewMap.invalidateSize(), 30); return; }
            const el = document.getElementById('portal-map-preview');
            if (!el) return;
            portalPreviewMap = L.map('portal-map-preview', {
                zoomControl: false, dragging: false, scrollWheelZoom: false,
                doubleClickZoom: false, boxZoom: false, keyboard: false,
                touchZoom: false, attributionControl: false, tap: false
            }).setView([20.0, 40.0], 1);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                 maxZoom: 19
            }).addTo(portalPreviewMap);
            setTimeout(() => portalPreviewMap.invalidateSize(), 30);
        }

        // ミニ地図プレビューをクリックした時、実際の地図画面のサイズまで拡大しながら
        // 遷移するアニメーション。地図がどこにあるか直感的に伝わるようにするための演出。
        window.expandPortalMap = function () {
            const card = document.getElementById('portal-map-preview-card');
            if (!card || card.classList.contains('portal-map-expanding')) return;
            const rect = card.getBoundingClientRect();

            const placeholder = document.createElement('div');
            placeholder.id = 'portal-map-preview-placeholder';
            placeholder.style.height = rect.height + 'px';
            placeholder.style.marginBottom = '16px';
            card.parentNode.insertBefore(placeholder, card);

            card.style.top = rect.top + 'px';
            card.style.left = rect.left + 'px';
            card.style.width = rect.width + 'px';
            card.style.height = rect.height + 'px';
            card.classList.add('portal-map-expanding');
            void card.offsetHeight; // 強制リフロー

            requestAnimationFrame(() => {
                card.style.top = '0px';
                card.style.left = '0px';
                card.style.width = '100vw';
                card.style.height = '100vh';
                card.style.borderRadius = '0px';
            });

            const start = performance.now();
            const duration = 480;
            function tick(now) {
                if (portalPreviewMap) portalPreviewMap.invalidateSize();
                if (now - start < duration) {
                    requestAnimationFrame(tick);
                } else {
                    closePortal();
                    card.classList.remove('portal-map-expanding');
                    card.style.top = '';
                    card.style.left = '';
                    card.style.width = '';
                    card.style.height = '';
                    card.style.borderRadius = '';
                    const ph = document.getElementById('portal-map-preview-placeholder');
                    if (ph) ph.remove();
                    map.invalidateSize();
                }
            }
            requestAnimationFrame(tick);
        };

        window.expandPortalList = function () {
            portalListLimit += 60;
            renderPortal();
        };

        function portalNewsScore(news) {
            const iso = news.firstSeenAt || news.publishedAt;
            const d = iso ? new Date(iso).getTime() : NaN;
            return isNaN(d) ? -Infinity : d;
        }

        // 総合画面の「国・地域」絞り込み(地域チップ → 選ぶとその地域の国チップが出る)
        const PORTAL_REGION_ORDER = ['日本', '東アジア', '東南アジア', '南アジア', '中東', 'アフリカ北部', 'アフリカ南部・東部', '西欧', '東欧・ロシア', '北米', '中南米', 'オセアニア'];
        let portalActiveRegion = null;
        let portalActiveCountry = null;

        window.setPortalRegion = function (region) {
            portalActiveRegion = (portalActiveRegion === region) ? null : region;
            portalActiveCountry = null;
            portalListLimit = 60;
            renderPortal();
        };
        window.setPortalCountry = function (country) {
            portalActiveCountry = (portalActiveCountry === country) ? null : country;
            portalListLimit = 60;
            renderPortal();
        };
        window.openSidebarFromPortal = function (id) {
            const news = newsData.find(n => n.id === id);
            if (!news) return;
            lastListState = null;
            openSidebar(news, 'right');
        };

        // [名前, 件数] の配列から、絞り込みチップの行(先頭に行ラベル)を作る
        function portalChipRow(label, entries, activeKey, handlerName) {
            if (entries.length === 0) return '';
            const chips = entries.map(([key, count]) => {
                const isActive = activeKey === key;
                const keyAttr = escapeHtml(key).replace(/"/g, '&quot;');
                return `<button type="button" class="portal-tab ${isActive ? 'portal-tab-active' : ''}" onclick="${handlerName}(&quot;${keyAttr}&quot;)">${escapeHtml(key)} <span class="opacity-60">${count}</span></button>`;
            }).join('');
            return `<span class="portal-row-label">${label}</span>${chips}`;
        }

        function renderPortal() {
            const tabsEl = document.getElementById('portal-tabs');
            const regionsEl = document.getElementById('portal-regions');
            const countriesEl = document.getElementById('portal-countries');
            const featuredEl = document.getElementById('portal-featured');
            const listEl = document.getElementById('portal-list');
            if (!tabsEl || !featuredEl || !listEl) return;

            const bookmarkToggleBtn = document.getElementById('portal-bookmark-toggle');
            if (bookmarkToggleBtn) {
                bookmarkToggleBtn.classList.toggle('bg-amber-100', portalShowBookmarkedOnly);
                bookmarkToggleBtn.classList.toggle('dark:bg-amber-900/40', portalShowBookmarkedOnly);
                bookmarkToggleBtn.classList.toggle('text-amber-700', portalShowBookmarkedOnly);
                bookmarkToggleBtn.classList.toggle('dark:text-amber-300', portalShowBookmarkedOnly);
                bookmarkToggleBtn.querySelector('i').className = portalShowBookmarkedOnly ? 'ph-fill ph-bookmark-simple text-lg' : 'ph ph-bookmark-simple text-lg';
            }

            const categories = Array.from(allCategoriesSet);
            tabsEl.innerHTML = ['<button type="button" class="portal-tab ' + (portalActiveCategory === null ? 'portal-tab-active' : '') + '" onclick="setPortalCategory(null)">総合</button>']
                .concat(categories.map(cat => {
                    const isActive = portalActiveCategory === cat;
                    const catAttr = escapeHtml(cat).replace(/"/g, '&quot;');
                    return `<button type="button" class="portal-tab ${isActive ? 'portal-tab-active' : ''}" onclick="setPortalCategory(&quot;${catAttr}&quot;)">${moodEmoji(cat)}${escapeHtml(cat)}</button>`;
                })).join('');

            // ジャンル・ブックマーク・検索で絞った「ベース」(地域・国の件数はこれを数える)
            const base = newsData.filter(n => {
                if (!n.location) return false;
                if (portalActiveCategory !== null && n.category !== portalActiveCategory) return false;
                if (portalShowBookmarkedOnly && !isBookmarked(n.id)) return false;
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const haystack = `${n.title || ''} ${n.originalTitle || ''} ${n.location.name || ''} ${n.country || ''}`.toLowerCase();
                    if (!haystack.includes(q)) return false;
                }
                return true;
            });

            // 地域チップ(固定の並び順。0件の地域は出さない)
            const regionCounts = new Map();
            base.forEach(n => { if (n.region) regionCounts.set(n.region, (regionCounts.get(n.region) || 0) + 1); });
            const regionEntries = PORTAL_REGION_ORDER.filter(r => regionCounts.has(r)).map(r => [r, regionCounts.get(r)]);
            if (portalActiveRegion && !regionCounts.has(portalActiveRegion)) {
                portalActiveRegion = null;
                portalActiveCountry = null;
            }
            if (regionsEl) regionsEl.innerHTML = portalChipRow('地域', regionEntries, portalActiveRegion, 'setPortalRegion');

            // 国チップ(地域を選んだときだけ。その地域の国を件数の多い順に)
            if (countriesEl) {
                if (portalActiveRegion) {
                    const countryCounts = new Map();
                    base.forEach(n => {
                        if (n.region === portalActiveRegion && n.country) countryCounts.set(n.country, (countryCounts.get(n.country) || 0) + 1);
                    });
                    const countryEntries = Array.from(countryCounts.entries()).sort((a, b) => b[1] - a[1]);
                    if (portalActiveCountry && !countryCounts.has(portalActiveCountry)) portalActiveCountry = null;
                    countriesEl.innerHTML = portalChipRow('国', countryEntries, portalActiveCountry, 'setPortalCountry');
                } else {
                    countriesEl.innerHTML = '';
                }
            }

            const pool = base.filter(n => {
                if (portalActiveRegion && n.region !== portalActiveRegion) return false;
                if (portalActiveCountry && n.country !== portalActiveCountry) return false;
                return true;
            });
            const sorted = pool.slice().sort((a, b) => portalNewsScore(b) - portalNewsScore(a));

            if (sorted.length === 0) {
                featuredEl.innerHTML = '';
                listEl.innerHTML = '<div class="text-center text-gray-500 dark:text-gray-400 mt-10">ニュースが見つかりませんでした</div>';
                return;
            }

            const spikyPlaces = computeSpikyPlaces();
            const nonSponsored = sorted.filter(n => !n.isSponsored);
            // 注目の3件は、おすすめ度の高いものを優先して選ぶ
            const featured = nonSponsored.slice().sort(newsRank).slice(0, 3);
            const featuredIds = new Set(featured.map(n => n.id));
            const rest = sorted.filter(n => !featuredIds.has(n.id));

            featuredEl.innerHTML = featured.map(news => {
                const relTime = formatRelativeTime(news.publishedAt);
                const isSpiky = spikyPlaces.has(news.location.name);
                const safeImg = news.imageUrl ? safeHttpUrl(news.imageUrl, '') : '';
                const imgHtml = safeImg
                    ? `<div class="h-32 rounded-lg overflow-hidden mb-2 bg-gray-200 dark:bg-gray-700"><img src="${escapeHtml(safeImg)}" alt="" class="w-full h-full object-cover" loading="lazy" onerror="this.parentElement.style.display='none';"></div>`
                    : '';
                const placeLabel = [news.country, news.location.name].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' ・ ');
                return `
                    <div class="portal-featured-card bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl p-4 shadow-sm"
                         role="button" tabindex="0" onclick="openSidebarFromPortal(${news.id})"
                         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSidebarFromPortal(${news.id});}">
                        ${imgHtml}
                        <div class="flex items-center gap-1.5 mb-2 flex-wrap">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold text-white" style="background-color: ${escapeHtml(news.color)}">${moodEmoji(news.category)}${escapeHtml(news.category)}</span>
                            <span class="text-[11px] text-gray-400 dark:text-gray-500">${escapeHtml(placeLabel)}${relTime ? '・' + escapeHtml(relTime) : ''}</span>
                            ${isSpiky ? '<span class="text-[10px] font-bold text-red-600 dark:text-red-400">🔥急上昇</span>' : ''}
                        </div>
                        <h3 class="font-extrabold text-sm leading-snug text-gray-900 dark:text-gray-100 mb-1">${escapeHtml(news.title)}</h3>
                    </div>
                `;
            }).join('');

            const visibleRest = rest.slice(0, portalListLimit);
            listEl.innerHTML = visibleRest.map(news => {
                const relTime = formatRelativeTime(news.publishedAt);
                const isSponsored = !!news.isSponsored;
                const isSpiky = !isSponsored && spikyPlaces.has(news.location.name);
                const tag = isSponsored
                    ? '<span class="text-[9px] font-bold text-amber-600 dark:text-amber-400">PR</span>'
                    : (isSpiky ? '<span class="text-[9px] font-bold text-red-600 dark:text-red-400">🔥急上昇</span>' : '');
                const safeImg = news.imageUrl ? safeHttpUrl(news.imageUrl, '') : '';
                const thumbHtml = safeImg
                    ? `<div class="w-16 h-16 rounded-lg overflow-hidden shrink-0 bg-gray-200 dark:bg-gray-700"><img src="${escapeHtml(safeImg)}" alt="" class="w-full h-full object-cover" loading="lazy" onerror="this.parentElement.style.display='none';"></div>`
                    : '';
                const placeLabel = [news.country, news.location.name].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' ・ ');
                return `
                    <div class="portal-list-item bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl p-4 shadow-sm flex gap-3 items-start"
                         role="button" tabindex="0" onclick="openSidebarFromPortal(${news.id})"
                         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSidebarFromPortal(${news.id});}">
                        ${thumbHtml}
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                                <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${escapeHtml(news.color)}"></span>
                                <span class="text-xs font-bold text-gray-500 dark:text-gray-400">${escapeHtml(placeLabel)}</span>
                                ${relTime ? `<span class="text-[11px] text-gray-400 dark:text-gray-500">・${escapeHtml(relTime)}</span>` : ''}
                                ${tag}
                            </div>
                            <h3 class="font-bold text-sm leading-tight text-gray-900 dark:text-gray-100">${moodEmoji(news.category)}${escapeHtml(news.title)}</h3>
                        </div>
                    </div>
                `;
            }).join('') + (rest.length > portalListLimit
                ? `<button type="button" onclick="expandPortalList()" class="w-full text-center text-xs font-bold text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl py-3 transition-colors">もっと見る(残り${rest.length - portalListLimit}件)</button>`
                : '');
        }

        function normalizeNewsPayload(data) {
            // 旧形式(配列そのもの)/新形式({generated_at, next_update_at, count, items})の
            // 両方を許容する
            if (Array.isArray(data)) {
                return { items: data, generated_at: null, next_update_at: null };
            }
            if (data && Array.isArray(data.items)) {
                return {
                    items: data.items,
                    generated_at: data.generated_at || null,
                    next_update_at: data.next_update_at || null,
                };
            }
            return { items: [], generated_at: null, next_update_at: null };
        }

        // news_data.json を読み込む。失敗したらサンプルデータで表示する。
        // ※ ブラウザで index.html を直接ダブルクリックして開く(file://)場合、
        //   fetchがブロックされるため、`python3 -m http.server` 等でローカルサーバー
        //   を立てて開くか、GitHub Pages / Cloudflare Pages にデプロイして見ること。
        // 2026-07-09: SNSや検索経由でURLに#news=<id>が付いた状態で開かれた場合、
        // その記事の場所へ地図を移動し、サイドバーを自動で開く(個別記事への固有リンク対応)。
        function openNewsFromUrlHash() {
            const match = location.hash.match(/^#news=(.+)$/);
            if (!match) return;
            const id = decodeURIComponent(match[1]);
            // URLのハッシュは文字列、news.idは数値なので、文字列に揃えて比較する
            const news = newsData.find(n => String(n.id) === id);
            if (!news || !news.location) return;
            closePortal();
            map.setView([news.location.lat, news.location.lng], Math.max(map.getZoom(), 6));
            openSidebar(news, 'right');
        }
        async function loadNewsData() {
            let generatedAt = null;
            let nextUpdateAt = null;
            let loadedReal = false;
            try {
                const res = await fetch('news_data.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const raw = await res.json();
                const normalized = normalizeNewsPayload(raw);
                if (normalized.items.length === 0) throw new Error('news_data.json が空でした');
                newsData = normalized.items;
                generatedAt = normalized.generated_at;
                nextUpdateAt = normalized.next_update_at;
                loadedReal = true;
            } catch (e) {
                console.warn('news_data.json 読み込み失敗。サンプルデータで表示します。', e);
                newsData = sampleNewsData;
                showStatus('news_data.json を読み込めなかったため、サンプルデータを表示中です。pipeline.py を実行し、ローカルサーバー経由で開いてください。');
            }

            if (loadedReal) {
                try {
                    const prevCount = parseInt(localStorage.getItem('sekanews_prev_count') || '0', 10);
                    if (prevCount > 0 && newsData.length > prevCount) {
                        showNewPinsToast(newsData.length - prevCount);
                    }
                    localStorage.setItem('sekanews_prev_count', String(newsData.length));
                } catch (e) { /* localStorage無効環境は無視 */ }
            }

            renderMap();
            renderPortal();
            buildTicker();
            ensurePortalPreviewMap();
            openNewsFromUrlHash();
            todayDateEl.textContent = formatTodayDate();
            if (generatedAt) showLastUpdated(generatedAt, nextUpdateAt);
            loadingOverlay.style.display = 'none';
        }

        loadNewsData();

        // 日付表示を秒単位のライブ時計として毎秒更新する
        setInterval(() => {
            todayDateEl.textContent = formatTodayDate();
        }, 1000);
    </script>
</body>
</html>
